<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrunoVerse — Care · Connect · Create Change</title>
  <meta name="description" content="BrunoVerse — one platform for pet owners and animal rescuers. Report animals in need, find nearby help with GPS, book vets, keep pet records and get AI first-aid guidance." />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1f5135" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BrunoVerse" />

  <!-- Fonts (falls back to system fonts when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet (OpenStreetMap maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/icons.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/geo.js" defer></script>
  <script src="js/ai.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/pages-auth.js" defer></script>
  <script src="js/pages-owner.js" defer></script>
  <script src="js/pages-rescuer.js" defer></script>
  <script src="js/pages-shared.js" defer></script>
  <script src="js/pages-legal.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
