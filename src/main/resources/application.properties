spring.application.name=BrunoVerse

# MySQL Database Configuration (Environment variable driven)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/brunoverse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Port
server.port=${PORT:8080}

# Google OAuth2 Configuration (Loaded securely from environment variables)
google.client.id=${GOOGLE_CLIENT_ID:}
google.client.secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/auth/google/callback}

# Google Places / Maps Server-Side Key
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
