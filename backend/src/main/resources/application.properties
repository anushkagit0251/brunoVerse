# ===============================================
#  BrunoVerse backend – local development defaults
#  H2 file database, demo data ON.
#  MySQL locally:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#  Production:     SPRING_PROFILES_ACTIVE=prod (see application-prod.properties)
# ===============================================
server.port=${PORT:8080}
spring.application.name=brunoverse

# --- Database (H2 file DB, created automatically in ./data) ---
spring.datasource.url=jdbc:h2:file:./data/brunoverse;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false

# --- BrunoVerse settings (override with environment variables) ---
# Secret used to sign login tokens. MUST be set (32+ random characters) in production.
brunoverse.jwt-secret=${JWT_SECRET:}
# true = fill an empty database with the sample users/cases (for demos). false for real launch.
brunoverse.demo-data=${DEMO_DATA:true}
# Comma-separated emails that get admin rights (verify vets/NGOs/rescuers).
brunoverse.admin-emails=${ADMIN_EMAILS:}
# Which websites may call the API (comma-separated, * = any). The bundled frontend is same-origin and always works.
brunoverse.cors-origins=${CORS_ORIGINS:*}
# Where uploaded photos/videos are stored.
brunoverse.upload-dir=${UPLOAD_DIR:uploads}

# --- Uploads ---
spring.servlet.multipart.max-file-size=60MB
spring.servlet.multipart.max-request-size=70MB

# --- Serve the frontend so http://localhost:8080 opens the app ---
spring.web.resources.static-locations=${FRONTEND_DIR:file:../frontend/},classpath:/static/

# --- JSON ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false
