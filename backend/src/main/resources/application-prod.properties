# ===============================================
#  Production profile (Render + Aiven, Railway, or any server)
#  Activate with SPRING_PROFILES_ACTIVE=prod (already set in the Dockerfile)
#
#  Database – either:
#   a) JDBC_URL + DB_USER + DB_PASSWORD   (Aiven, TiDB, any MySQL)
#      e.g. JDBC_URL=jdbc:mysql://HOST:PORT/defaultdb?sslMode=REQUIRED
#   b) MYSQLHOST/MYSQLPORT/MYSQLUSER/MYSQLPASSWORD/MYSQLDATABASE (Railway)
# ===============================================
spring.datasource.url=${JDBC_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:brunoverse}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=240000

spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

brunoverse.demo-data=${DEMO_DATA:false}
brunoverse.upload-dir=${UPLOAD_DIR:/data/uploads}
spring.web.resources.static-locations=${FRONTEND_DIR:file:/app/frontend/}

# Behind the host's proxy: trust X-Forwarded-* headers (correct https links)
server.forward-headers-strategy=framework
# Small server (Render free = 512 MB RAM)
server.tomcat.threads.max=30
